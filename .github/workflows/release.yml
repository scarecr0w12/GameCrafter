name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Windows'
        uses: ./.github/actions/ensure-windows-spectre
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - run: npm ci
      - run: npx turbo run build --filter=@gamecrafter/control-room^...
      - run: npm run download:plugins
      - run: npm run package:${{ matrix.target }} -w @gamecrafter/control-room
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: |
            apps/control-room/dist/*.AppImage
            apps/control-room/dist/*.deb
          if-no-files-found: error
          retention-days: 7
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: packages-win
          path: apps/control-room/dist/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@gamecrafter/platform-service
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create signed release metadata
        run: node scripts/create-release-metadata.cjs release-artifacts
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-artifacts/*
